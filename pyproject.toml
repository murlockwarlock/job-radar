[project]
name = "job-radar"
version = "0.1.0"
description = "Production-ready vacancy monitoring service for HH.ru and HH.kz"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiogram==3.24.0",
  "alembic==1.15.2",
  "asyncpg==0.30.0",
  "celery[redis]==5.5.3",
  "fastapi==0.143.3",
  "httpx==0.28.1",
  "pydantic-settings==2.11.0",
  "psycopg2-binary==2.9.10",
  "python-multipart==0.0.20",
  "redis==5.0.4",
  "sqlalchemy[asyncio]==2.0.51",
  "tenacity==9.1.2",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.3.0",
  "pytest-cov==6.2.1",
  "ruff==0.16.7",
  "aiosqlite==0.20.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = "(^alembic/|^tests/)"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
